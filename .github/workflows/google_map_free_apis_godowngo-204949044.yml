# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - godowngo-204949044

on:
  push:
    branches:
      - google_map_free_apis
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'
          
     # - name: Set up Java 17
      #  uses: actions/setup-java@v3
       # with:
        #  distribution: 'temurin'  # Use the Eclipse Temurin distribution
         # java-version: '17'  # You can use '11' if needed

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'  # Specify a known stable version
          cache: true

      - name: Install dependencies, build, and test (Flutter)
        run: |
          cd flutter_application_demo
          flutter pub get
          flutter build web --release  # Change this based on your target (apk, ios, web, etc.)
          # flutter test
          
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: build/web
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'godowngo-web-401027116'
          slot-name: 'Production'
          package:  build/web
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5304467E950341ADA379BB36B6EF0941 }}
